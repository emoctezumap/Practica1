services:
  postgres:
    image: postgres:16
    container_name: servidor_postgres
    environment:
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: cliente_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@practica.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pgdata: